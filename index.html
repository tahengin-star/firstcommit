<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Modulux ESP32-S3 IDE</title>
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly/msg/th.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f0f2f5; }

        .toolbar { background: #2c3e50; color: white; padding: 10px 16px; display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); flex-wrap: wrap; }
        .logo { font-size: 1.1rem; font-weight: bold; color: #3498db; margin-right: 10px; white-space: nowrap; }

        #main-container { display: flex; flex-grow: 1; overflow: hidden; }
        #blocklyDiv { flex-grow: 1; height: 100%; min-width: 0; }

        #code-panel { width: 380px; min-width: 280px; background: #1e1e1e; display: none; flex-direction: column; border-left: 2px solid #34495e; }
        #code-panel.visible { display: flex; }
        #code-panel-header { background: #34495e; color: #bdc3c7; padding: 6px 14px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        #code-output { flex-grow: 1; color: #dcdcaa; padding: 12px; overflow-y: auto; font-family: 'Consolas', monospace; white-space: pre; font-size: 0.82rem; }

        .console-resize-handle { height: 6px; background: #34495e; cursor: ns-resize; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .console-resize-handle:hover { background: #3498db; }
        .console-resize-handle::before { content: ''; width: 40px; height: 2px; background: #7f8c8d; border-radius: 2px; }
        .console-container { height: 180px; min-height: 60px; max-height: 80vh; background: #1e1e1e; display: flex; flex-direction: column; border-top: none; flex-shrink: 0; }
        .console-header { background: #34495e; color: #bdc3c7; padding: 5px 15px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        #console { flex-grow: 1; color: #00ff00; padding: 10px; overflow-y: auto; font-family: 'Consolas', monospace; white-space: pre-wrap; font-size: 0.85rem; }

        button { padding: 7px 14px; cursor: pointer; border-radius: 6px; border: none; font-weight: 600; transition: 0.2s; font-size: 0.85rem; }
        button:active { transform: scale(0.95); }
        .btn-connect    { background: #e67e22; color: white; }
        .btn-disconnect { background: #e74c3c; color: white; display: none; }
        .btn-code       { background: #8e44ad; color: white; }
        .btn-upload     { background: #e74c3c; color: white; font-size: 0.9rem; padding: 8px 18px; }
        .btn-upload:disabled { background: #7f8c8d; cursor: not-allowed; }
        .btn-download   { background: #27ae60; color: white; }
        .btn-save       { background: #3498db; color: white; }
        .btn-load       { background: #95a5a6; color: white; }
        .btn-copy       { background: #555; color: #ddd; padding: 3px 10px; font-size: 0.75rem; }
        .btn-refresh    { background: #34495e; color: white; padding: 7px 10px; }
        #status { font-size: 0.82rem; margin-left: auto; color: #ecf0f1; white-space: nowrap; }
        .port-group { display: flex; gap: 4px; align-items: center; }
        .port-group label { font-size: 0.8rem; color: #bdc3c7; white-space: nowrap; }
        #port-select { padding: 6px 8px; border-radius: 6px; border: none; font-size: 0.82rem; background: #34495e; color: white; min-width: 110px; }
        #port-manual { padding: 6px 8px; border-radius: 6px; border: none; font-size: 0.82rem; background: #34495e; color: white; width: 80px; display: none; }
        #port-manual::placeholder { color: #7f8c8d; }
        .server-dot { width: 10px; height: 10px; border-radius: 50%; background: #7f8c8d; display: inline-block; margin-right: 4px; }
        .server-dot.online  { background: #2ecc71; }
        .server-dot.offline { background: #e74c3c; }
        .toolbar-sep { width: 1px; background: #4a6580; align-self: stretch; margin: 0 4px; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="logo">🔧 MODULUX ESP32-S3</div>
        <div class="toolbar-sep"></div>
        <!-- Port Selector -->
        <div class="port-group">
            <span class="server-dot" id="server-dot" title="Server status"></span>
            <label>Port:</label>
            <select id="port-select" onchange="onPortSelectChange()"><option value="">-- เลือก Port --</option></select>
            <input id="port-manual" type="text" placeholder="COM13" title="กรอก Port เอง" />
            <button class="btn-refresh" onclick="fetchPorts()" title="รีเฟรช Port">🔄</button>
        </div>
        <div class="toolbar-sep"></div>
        <!-- Main Action -->
        <button class="btn-upload" id="btn-upload" onclick="uploadCode()">🚀 Compile &amp; Upload</button>
        <div class="toolbar-sep"></div>
        <!-- Serial Monitor -->
        <button class="btn-connect"    id="btn-connect"    onclick="connectSerial()">📻 Serial Monitor</button>
        <button class="btn-disconnect" id="btn-disconnect" onclick="disconnectSerial()">⛔ ปิด Monitor</button>
        <div class="toolbar-sep"></div>
        <!-- Secondary -->
        <button class="btn-code"     onclick="toggleCodePanel()">📋 ดูโค้ด C++</button>
        <button class="btn-download" onclick="downloadCode()">💾 ดาวน์โหลด .ino</button>
        <button class="btn-save"     onclick="saveProject()">🗂️ บันทึก</button>
        <button class="btn-load"     onclick="document.getElementById('fileInput').click()">📁 เปิด</button>
        <input type="file" id="fileInput" style="display:none" onchange="loadProject(event)">
        <span id="status">สถานะ: ยังไม่ได้เชื่อมต่อ ⚪</span>
    </div>

    <div id="main-container">
        <div id="blocklyDiv"></div>
        <div id="code-panel">
            <div id="code-panel-header">
                <span>Generated C++ — ESP32-S3 Wroom-1</span>
                <button class="btn-copy" onclick="copyCode()">📋 คัดลอก</button>
            </div>
            <pre id="code-output">// กดปุ่ม "ดูโค้ด C++" เพื่อสร้างโค้ด</pre>
        </div>
    </div>

    <div class="console-resize-handle" id="console-resize-handle"></div>
    <div class="console-container" id="console-container">
        <div class="console-header">
            <span>📡 SERIAL MONITOR (อ่านข้อมูลจากบอร์ด)</span>
            <span onclick="document.getElementById('console').innerText=''" style="cursor:pointer">เคลียร์ [X]</span>
        </div>
        <div id="console">ยินดีต้อนรับสู่ Modulux ESP32-S3 IDE... เชื่อมต่อบอร์ดเพื่อดู Serial output</div>
    </div>

    <xml id="toolbox" style="display:none">
        <category name="⚙️ พื้นฐาน" colour="210">
            <block type="arduino_setup"></block>
            <block type="arduino_loop"></block>
        </category>
        <category name="💡 GPIO" colour="230">
            <block type="pin_mode"></block>
            <block type="digital_write"></block>
            <block type="digital_read"></block>
            <block type="analog_write"></block>
            <block type="analog_read"></block>
        </category>
        <category name="📡 Serial" colour="160">
            <block type="serial_begin"></block>
            <block type="serial_print">
                <value name="TEXT"><block type="text"><field name="TEXT">Hello World</field></block></value>
            </block>
            <block type="serial_println">
                <value name="TEXT"><block type="text"><field name="TEXT">Hello World</field></block></value>
            </block>
        </category>
        <category name="⏱️ เวลา" colour="120">
            <block type="base_delay_ms"></block>
            <block type="base_delay_s"></block>
            <block type="millis_block"></block>
        </category>
        <category name="🔁 ลูป" colour="120">
            <block type="while_loop"></block>
            <block type="controls_repeat_ext">
                <value name="TIMES"><block type="math_number"><field name="NUM">10</field></block></value>
            </block>
        </category>
        <category name="🔀 เงื่อนไข" colour="210">
            <block type="controls_if"></block>
            <block type="logic_compare"></block>
            <block type="logic_operation"></block>
            <block type="logic_negate"></block>
        </category>
        <category name="🔢 ตัวแปร" colour="330" custom="VARIABLE"></category>
        <category name="➕ คณิตศาสตร์" colour="230">
            <block type="math_number"></block>
            <block type="math_arithmetic"></block>
            <block type="math_modulo"></block>
        </category>
        <category name="📝 ข้อความ" colour="160">
            <block type="text"></block>
        </category>
    </xml>

    <script>
    // =============================================================
    // 1. สร้าง Arduino Code Generator
    // =============================================================
    const Arduino = new Blockly.Generator('Arduino');

    Arduino.ORDER_ATOMIC     = 0;
    Arduino.ORDER_UNARY      = 2;
    Arduino.ORDER_MULTIPLY   = 3;
    Arduino.ORDER_ADD        = 4;
    Arduino.ORDER_RELATIONAL = 6;
    Arduino.ORDER_EQUALITY   = 7;
    Arduino.ORDER_AND        = 11;
    Arduino.ORDER_OR         = 12;
    Arduino.ORDER_NONE       = 99;

    Arduino.scrub_ = function(block, code, opt_thisOnly) {
        const nextBlock = block.nextConnection && block.nextConnection.targetBlock();
        if (nextBlock && !opt_thisOnly) return code + Arduino.blockToCode(nextBlock);
        return code;
    };

    Arduino.workspaceToCode = function(workspace) {
        this.init(workspace);
        Arduino.setups_ = Object.create(null);
        let setupCode = '', loopCode = '', globalVars = '';
        for (const block of workspace.getTopBlocks(true)) {
            if (block.type === 'arduino_setup') setupCode += Arduino.statementToCode(block, 'DO');
            else if (block.type === 'arduino_loop') loopCode += Arduino.statementToCode(block, 'DO');
        }
        for (const key in Arduino.definitions_) globalVars += Arduino.definitions_[key] + '\n';
        let setupAutoCode = '';
        for (const key in Arduino.setups_) setupAutoCode += Arduino.setups_[key] + '\n';
        return `// Generated by Modulux ESP32-S3 IDE
// Board: ESP32-S3 Wroom-1
#include <Arduino.h>
${globalVars}
void setup() {
${setupAutoCode}
${setupCode || '  // ลาก "Setup" บล็อกมาวาง\n'}
}

void loop() {
${loopCode || '  // ลาก "Loop" บล็อกมาวาง\n'}
}`;
    };

    // =============================================================
    // 2. Custom Blocks + Arduino Generators
    // =============================================================

    // --- Setup / Loop ---
    Blockly.Blocks['arduino_setup'] = {
        init: function() {
            this.appendDummyInput().appendField('⚙️ Setup (ทำครั้งเดียวตอนเปิด)');
            this.appendStatementInput('DO').setCheck(null);
            this.setColour(210);
            this.setTooltip('void setup()');
        }
    };
    Arduino['arduino_setup'] = function(block) {
        return Arduino.statementToCode(block, 'DO');
    };

    Blockly.Blocks['arduino_loop'] = {
        init: function() {
            this.appendDummyInput().appendField('🔁 Loop (วนซ้ำตลอด)');
            this.appendStatementInput('DO').setCheck(null);
            this.setColour(120);
            this.setTooltip('void loop()');
        }
    };
    Arduino['arduino_loop'] = function(block) {
        return Arduino.statementToCode(block, 'DO');
    };

    // --- GPIO ---
    Blockly.Blocks['pin_mode'] = {
        init: function() {
            this.appendDummyInput()
                .appendField('📌 ตั้งค่าขา').appendField(new Blockly.FieldNumber(2, 0, 48), 'PIN')
                .appendField('เป็น').appendField(new Blockly.FieldDropdown([['OUTPUT','OUTPUT'],['INPUT','INPUT'],['INPUT_PULLUP','INPUT_PULLUP']]), 'MODE');
            this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour(230);
        }
    };
    Arduino['pin_mode'] = function(b) { return `  pinMode(${b.getFieldValue('PIN')}, ${b.getFieldValue('MODE')});\n`; };

    Blockly.Blocks['digital_write'] = {
        init: function() {
            this.appendDummyInput()
                .appendField('💡 สั่งขา').appendField(new Blockly.FieldNumber(2, 0, 48), 'PIN')
                .appendField('ให้').appendField(new Blockly.FieldDropdown([['HIGH (เปิด)','HIGH'],['LOW (ปิด)','LOW']]), 'STATE');
            this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour(230);
        }
    };
    Arduino['digital_write'] = function(b) {
        const pin = b.getFieldValue('PIN');
        Arduino.setups_[`pin_mode_out_${pin}`] = `  pinMode(${pin}, OUTPUT);`;
        return `  digitalWrite(${pin}, ${b.getFieldValue('STATE')});\n`;
    };

    Blockly.Blocks['digital_read'] = {
        init: function() {
            this.appendDummyInput().appendField('🔍 อ่านขา').appendField(new Blockly.FieldNumber(2, 0, 48), 'PIN');
            this.setOutput(true, 'Number'); this.setColour(230);
        }
    };
    Arduino['digital_read'] = function(b) { return [`digitalRead(${b.getFieldValue('PIN')})`, Arduino.ORDER_ATOMIC]; };

    Blockly.Blocks['analog_write'] = {
        init: function() {
            this.appendDummyInput()
                .appendField('🎚️ PWM ขา').appendField(new Blockly.FieldNumber(2, 0, 48), 'PIN')
                .appendField('ค่า').appendField(new Blockly.FieldNumber(128, 0, 255), 'VAL');
            this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour(230);
        }
    };
    Arduino['analog_write'] = function(b) { return `  analogWrite(${b.getFieldValue('PIN')}, ${b.getFieldValue('VAL')});\n`; };

    Blockly.Blocks['analog_read'] = {
        init: function() {
            this.appendDummyInput().appendField('📊 อ่านค่า Analog ขา').appendField(new Blockly.FieldNumber(1, 0, 48), 'PIN');
            this.setOutput(true, 'Number'); this.setColour(230);
        }
    };
    Arduino['analog_read'] = function(b) { return [`analogRead(${b.getFieldValue('PIN')})`, Arduino.ORDER_ATOMIC]; };

    // --- Serial ---
    Blockly.Blocks['serial_begin'] = {
        init: function() {
            this.appendDummyInput().appendField('📡 เริ่ม Serial').appendField(new Blockly.FieldDropdown([['115200','115200'],['9600','9600'],['57600','57600']]), 'BAUD').appendField('baud');
            this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour(160);
        }
    };
    Arduino['serial_begin'] = function(b) {
        const baud = b.getFieldValue('BAUD');
        Arduino.setups_[`serial_begin_${baud}`] = `  Serial.begin(${baud});`;
        return '';
    };

    Blockly.Blocks['serial_print'] = {
        init: function() {
            this.appendValueInput('TEXT').setCheck(null).appendField('🖨️ Serial.print');
            this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour(160);
        }
    };
    Arduino['serial_print'] = function(b) {
        Arduino.setups_['serial_begin'] = '  Serial.begin(115200);';
        return `  Serial.print(${Arduino.valueToCode(b, 'TEXT', Arduino.ORDER_NONE) || '"Hello World"'});\n`;
    };

    Blockly.Blocks['serial_println'] = {
        init: function() {
            this.appendValueInput('TEXT').setCheck(null).appendField('🖨️ Serial.println');
            this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour(160);
        }
    };
    Arduino['serial_println'] = function(b) {
        Arduino.setups_['serial_begin'] = '  Serial.begin(115200);';
        return `  Serial.println(${Arduino.valueToCode(b, 'TEXT', Arduino.ORDER_NONE) || '"Hello World"'});\n`;
    };

    // --- เวลา ---
    Blockly.Blocks['base_delay_ms'] = {
        init: function() {
            this.appendDummyInput().appendField('⏳ รอ').appendField(new Blockly.FieldNumber(500, 0), 'MS').appendField('ms');
            this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour(120);
        }
    };
    Arduino['base_delay_ms'] = function(b) { return `  delay(${b.getFieldValue('MS')});\n`; };

    Blockly.Blocks['base_delay_s'] = {
        init: function() {
            this.appendDummyInput().appendField('⏳ รอ').appendField(new Blockly.FieldNumber(1, 0), 'SEC').appendField('วินาที');
            this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour(120);
        }
    };
    Arduino['base_delay_s'] = function(b) { return `  delay(${b.getFieldValue('SEC') * 1000});\n`; };

    Blockly.Blocks['millis_block'] = {
        init: function() { this.appendDummyInput().appendField('⏱️ millis()'); this.setOutput(true, 'Number'); this.setColour(120); }
    };
    Arduino['millis_block'] = function() { return ['millis()', Arduino.ORDER_ATOMIC]; };

    // --- ลูป ---
    Blockly.Blocks['while_loop'] = {
        init: function() {
            this.appendDummyInput().appendField('🔁 while (true)');
            this.appendStatementInput('DO').setCheck(null).appendField('ทำ');
            this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour(120);
        }
    };
    Arduino['while_loop'] = function(b) {
        return `  while (true) {\n${Arduino.statementToCode(b, 'DO') || '    // empty\n'}  }\n`;
    };

    // =============================================================
    // 3. Built-in Blockly blocks → Arduino
    // =============================================================
    Arduino['controls_repeat_ext'] = function(b) {
        const times = Arduino.valueToCode(b, 'TIMES', Arduino.ORDER_NONE) || '10';
        return `  for (int i = 0; i < ${times}; i++) {\n${Arduino.statementToCode(b, 'DO')}  }\n`;
    };

    Arduino['controls_if'] = function(b) {
        let code = '';
        for (let i = 0; i <= (b.elseifCount_ || 0); i++) {
            const cond = Arduino.valueToCode(b, 'IF' + i, Arduino.ORDER_NONE) || 'false';
            code += (i === 0 ? '  if' : '  else if') + ` (${cond}) {\n${Arduino.statementToCode(b, 'DO' + i)}  }\n`;
        }
        if (b.elseCount_) code += `  else {\n${Arduino.statementToCode(b, 'ELSE')}  }\n`;
        return code;
    };

    Arduino['logic_compare'] = function(b) {
        const ops = { EQ:'==', NEQ:'!=', LT:'<', LTE:'<=', GT:'>', GTE:'>=' };
        const a = Arduino.valueToCode(b, 'A', Arduino.ORDER_RELATIONAL) || '0';
        const bv = Arduino.valueToCode(b, 'B', Arduino.ORDER_RELATIONAL) || '0';
        return [`${a} ${ops[b.getFieldValue('OP')]} ${bv}`, Arduino.ORDER_RELATIONAL];
    };

    Arduino['logic_operation'] = function(b) {
        const op = b.getFieldValue('OP') === 'AND' ? '&&' : '||';
        const a = Arduino.valueToCode(b, 'A', Arduino.ORDER_AND) || 'false';
        const bv = Arduino.valueToCode(b, 'B', Arduino.ORDER_AND) || 'false';
        return [`${a} ${op} ${bv}`, Arduino.ORDER_AND];
    };

    Arduino['logic_negate'] = function(b) {
        return [`!(${Arduino.valueToCode(b, 'BOOL', Arduino.ORDER_UNARY) || 'false'})`, Arduino.ORDER_UNARY];
    };

    Arduino['math_number'] = function(b) { return [String(b.getFieldValue('NUM')), Arduino.ORDER_ATOMIC]; };

    Arduino['math_arithmetic'] = function(b) {
        const ops = { ADD:'+', MINUS:'-', MULTIPLY:'*', DIVIDE:'/', POWER:'**' };
        const a = Arduino.valueToCode(b, 'A', Arduino.ORDER_ADD) || '0';
        const bv = Arduino.valueToCode(b, 'B', Arduino.ORDER_ADD) || '0';
        return [`${a} ${ops[b.getFieldValue('OP')]} ${bv}`, Arduino.ORDER_ADD];
    };

    Arduino['math_modulo'] = function(b) {
        const a = Arduino.valueToCode(b, 'DIVIDEND', Arduino.ORDER_MULTIPLY) || '0';
        const bv = Arduino.valueToCode(b, 'DIVISOR', Arduino.ORDER_MULTIPLY) || '0';
        return [`${a} % ${bv}`, Arduino.ORDER_MULTIPLY];
    };

    Arduino['text'] = function(b) { return [`"${b.getFieldValue('TEXT')}"`, Arduino.ORDER_ATOMIC]; };

    Arduino['variables_get'] = function(b) {
        const name = Arduino.nameDB_.getName(b.getFieldValue('VAR'), Blockly.Names.NameType.VARIABLE);
        return [name, Arduino.ORDER_ATOMIC];
    };

    Arduino['variables_set'] = function(b) {
        const name = Arduino.nameDB_.getName(b.getFieldValue('VAR'), Blockly.Names.NameType.VARIABLE);
        const val = Arduino.valueToCode(b, 'VALUE', Arduino.ORDER_NONE) || '0';
        Arduino.definitions_['var_' + name] = `int ${name} = 0;`;
        return `  ${name} = ${val};\n`;
    };

    // =============================================================
    // Blockly v10+ compatibility: forward all generators to forBlock
    // and define init() for definitions_ / nameDB_
    // =============================================================
    Arduino.forBlock = Arduino.forBlock || {};
    Object.getOwnPropertyNames(Arduino).forEach(function(k) {
        if (typeof Arduino[k] === 'function' && !(k in Arduino.forBlock)) {
            Arduino.forBlock[k] = Arduino[k];
        }
    });

    Arduino.init = function(workspace) {
        Arduino.definitions_ = Object.create(null);
        Arduino.setups_      = Object.create(null);
        if (typeof Blockly.Names !== 'undefined') {
            Arduino.nameDB_ = new Blockly.Names('');
            Arduino.nameDB_.reset();
            if (workspace && workspace.getVariableMap) {
                Arduino.nameDB_.setVariableMap(workspace.getVariableMap());
            }
        }
    };

    // =============================================================
    // 4. ตั้งค่า Workspace
    // =============================================================
    const workspace = Blockly.inject('blocklyDiv', {
        toolbox: document.getElementById('toolbox'),
        grid: { spacing: 20, length: 3, colour: '#ccc', snap: true },
        zoom: { controls: true, wheel: true, startScale: 1.0, maxScale: 3, minScale: 0.3, scaleSpeed: 1.2 },
        trashcan: true
    });

    workspace.addChangeListener(function() {
        if (document.getElementById('code-panel').classList.contains('visible')) updateCodePreview();
    });

    // =============================================================
    // 5. Code Panel
    // =============================================================
    function toggleCodePanel() {
        const panel = document.getElementById('code-panel');
        panel.classList.toggle('visible');
        if (panel.classList.contains('visible')) updateCodePreview();
    }

    function updateCodePreview() {
        try {
            document.getElementById('code-output').textContent = Arduino.workspaceToCode(workspace);
        } catch(e) {
            document.getElementById('code-output').textContent = '// Error: ' + e;
        }
    }

    function copyCode() {
        navigator.clipboard.writeText(Arduino.workspaceToCode(workspace))
            .then(() => logToConsole('\n📋 คัดลอกโค้ดแล้ว'));
    }

    function downloadCode() {
        const blob = new Blob([Arduino.workspaceToCode(workspace)], { type: 'text/plain' });
        const a = document.createElement('a');
        a.download = 'modulux_esp32s3.ino';
        a.href = URL.createObjectURL(blob);
        a.click();
        logToConsole('\n💾 ดาวน์โหลด modulux_esp32s3.ino แล้ว\n💡 นำไปเปิดใน Arduino IDE และเลือกบอร์ด "ESP32S3 Dev Module"');
    }

    // =============================================================
    // 6. Web Serial — Serial Monitor  +  Compile/Upload via Server
    // =============================================================
    const SERVER = 'http://localhost:8765';
    let port, reader;

    // ---- Server status ----
    async function checkServer() {
        const btnUpload = document.getElementById('btn-upload');
        try {
            const r = await fetch(SERVER + '/status', { signal: AbortSignal.timeout(2000) });
            const s = await r.json();
            const dot = document.getElementById('server-dot');
            dot.className = 'server-dot online';
            dot.title = `Server ออนไลน์ | arduino-cli: ${s.arduino_cli ? '✅' : '❌'}`;
            btnUpload.disabled = false;
            btnUpload.title = '';
            if (!s.arduino_cli) {
                logToConsole('⚠️ arduino-cli ไม่ได้ติดตั้ง — ดูวิธีติดตั้งใน README.md');
            }
            await fetchPorts();
        } catch {
            const dot = document.getElementById('server-dot');
            dot.className = 'server-dot offline';
            dot.title = 'Server ออฟไลน์ — รัน start_server.bat';
            btnUpload.disabled = true;
            btnUpload.title = 'Server ยังไม่ทำงาน';
            logToConsole('⚠️ Server ยังไม่ได้เริ่มทำงาน\n👉 ดับเบิลคลิก start_server.bat เพื่อเริ่ม Server\n💡 หรือกรอก COM Port เองในช่อง input ขวาจาก dropdown');
        }
    }
    checkServer();

    // ---- Port list ----
    async function fetchPorts() {
        try {
            const r = await fetch(SERVER + '/ports', { signal: AbortSignal.timeout(5000) });
            const ports = await r.json(); // [{port, desc}, ...]
            const sel = document.getElementById('port-select');
            const prev = sel.value;
            sel.innerHTML = '<option value="">— เลือก Port —</option>';
            ports.forEach(p => {
                const o = document.createElement('option');
                o.value = p.port;
                // แสดง COM13 - USB JTAG/serial debug unit
                const label = p.desc && p.desc !== p.port ? `${p.port} — ${p.desc}` : p.port;
                o.textContent = label;
                sel.appendChild(o);
            });
            if (prev && ports.find(p => p.port === prev)) sel.value = prev;
            else if (ports.length === 1) sel.value = ports[0].port;

            if (ports.length === 0) {
                logToConsole('\n⚠️ ไม่พบ COM Port — ตรวจสอบการเชื่อมต่อ USB และ driver');
                // แสดงช่อง manual input เพื่อให้กรอก COM Port เอง
                document.getElementById('port-manual').style.display = 'block';
                document.getElementById('port-manual').placeholder = 'เช่น COM13';
            } else {
                logToConsole(`\n🔍 พบ ${ports.length} Port: ` + ports.map(p => p.port).join(', '));
                document.getElementById('port-manual').style.display = 'none';
            }
        } catch { /* server offline */
            // Server ไม่พบ — แสดงช่อง manual input ให้กรอกเอง
            document.getElementById('port-manual').style.display = 'block';
        }
    }

    function onPortSelectChange() {
        const sel = document.getElementById('port-select').value;
        // ถ้าเลือก "-- เลือก Port --" แสดงช่อง manual
        document.getElementById('port-manual').style.display = sel ? 'none' : 'block';
    }

    function getSelectedPort() {
        const sel = document.getElementById('port-select').value;
        if (sel) return sel;
        return document.getElementById('port-manual').value.trim();
    }

    // ---- Compile & Upload ----
    async function uploadCode() {
        const portVal = getSelectedPort();
        if (!portVal) { alert('กรุณาเลือก COM Port ก่อน หรือกรอก Port เองในช่อง input!'); return; }

        const serverDot = document.getElementById('server-dot');
        if (!serverDot.classList.contains('online')) {
            await checkServer();
            if (!serverDot.classList.contains('online')) {
                alert('Server ยังไม่พร้อม (จุดหน้า Port เป็นสีแดง)\nกรุณารัน start_server.bat ก่อน');
                return;
            }
        }

        // ถ้า Serial Monitor เปิดอยู่ ให้ปิดก่อน (port ถูกใช้งานอยู่)
        if (port || document.getElementById('btn-disconnect').style.display !== 'none') {
            logToConsole('\n🔌 ปิด Serial Monitor ชั่วคราวเพื่อ Upload...');
            await disconnectSerial();
            await new Promise(resolve => setTimeout(resolve, 250));
        }

        const btn = document.getElementById('btn-upload');
        btn.disabled = true;
        btn.textContent = '⏳ กำลัง Compile...';

        let code;
        try { code = Arduino.workspaceToCode(workspace); }
        catch(e) { logToConsole('\n❌ ไม่สามารถสร้างโค้ด: ' + e); btn.disabled = false; btn.textContent = '🚀 Compile & Upload'; return; }

        logToConsole('\n' + '═'.repeat(45));
        logToConsole('🚀 เริ่ม Compile & Upload...');

        try {
            const resp = await fetch(SERVER + '/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, port: portVal })
            });

            const streamReader = resp.body.getReader();
            const dec = new TextDecoder();
            let buf = '';
            while (true) {
                const { value, done } = await streamReader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop();
                for (const line of lines) {
                    if (line.trim() === '[END]') break;
                    if (line.trim()) logToConsole(line);
                }
            }
            logToConsole('═'.repeat(45));
        } catch(e) {
            logToConsole('\n❌ เชื่อมต่อ Server ไม่ได้: ' + e);
            logToConsole('👉 ดับเบิลคลิก start_server.bat เพื่อเริ่ม Server ก่อน');
            if ((e + '').toLowerCase().includes('access is denied') || (e + '').toLowerCase().includes('port is busy')) {
                logToConsole('💡 Port Busy: ปิดปุ่ม "⛔ ปิด Monitor" ให้เรียบร้อยก่อน แล้วค่อยกด 🚀 Compile & Upload');
            }
        } finally {
            btn.disabled = false;
            btn.textContent = '🚀 Compile & Upload';
        }
    }

    // ---- Serial Monitor (Web Serial API) ----
    async function connectSerial() {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            document.getElementById('status').innerText = 'สถานะ: เชื่อมต่อแล้ว ✅';
            document.getElementById('status').style.color = '#2ecc71';
            document.getElementById('btn-connect').style.display = 'none';
            document.getElementById('btn-disconnect').style.display = 'inline-block';
            logToConsole('\n✅ เชื่อมต่อ Serial สำเร็จ — รอรับข้อมูลจากบอร์ด...\n');
            readSerial();
        } catch (err) {
            if (!err.toString().includes('No port selected'))
                logToConsole('\n❌ เชื่อมต่อล้มเหลว: ' + err);
        }
    }

    async function readSerial() {
        const decoder = new TextDecoder();
        while (port && port.readable) {
            reader = port.readable.getReader();
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) logToConsole(decoder.decode(value));
                }
                break; // อ่านเสร็จปกติ
            } catch (err) {
                const msg = err.toString();
                if (msg.includes('cancelled') || msg.includes('closed')) break;
                // Framing/Parity/Buffer error = บอร์ดกำลัง Boot — รอแล้วอ่านต่อ
                if (msg.includes('framing') || msg.includes('parity') || msg.includes('overrun') || msg.includes('buffer')) {
                    await new Promise(r => setTimeout(r, 100));
                    // วนลูปใหม่เพื่ออ่านต่อ
                } else {
                    logToConsole('\n⚠️ Serial: ' + err);
                    break;
                }
            } finally {
                try { reader.releaseLock(); } catch(e) {}
                reader = null;
            }
        }
    }

    async function disconnectSerial() {
        try {
            if (reader) { try { await reader.cancel(); } catch(e) {} }
            if (port)   { await port.close(); port = null; }
            document.getElementById('status').innerText = 'สถานะ: ยังไม่ได้เชื่อมต่อ ⚪';
            document.getElementById('status').style.color = '#ecf0f1';
            document.getElementById('btn-connect').style.display = 'inline-block';
            document.getElementById('btn-disconnect').style.display = 'none';
            logToConsole('\n🔌 ตัดการเชื่อมต่อเรียบร้อย');
        } catch (err) { logToConsole('\n⚠️ ' + err); }
    }

    function logToConsole(text) {
        const c = document.getElementById('console');
        c.innerText += text;
        c.scrollTop = c.scrollHeight;
    }

    // =============================================================
    // 7. Save / Load Project
    // =============================================================
    function saveProject() {
        const blob = new Blob([Blockly.Xml.domToPrettyText(Blockly.Xml.workspaceToDom(workspace))], { type: 'text/xml' });
        const a = document.createElement('a');
        a.download = 'project.modulux';
        a.href = URL.createObjectURL(blob);
        a.click();
    }

    function loadProject(event) {
        if (!event.target.files[0]) return;
        const fileReader = new FileReader();
        fileReader.onload = e => {
            workspace.clear();
            Blockly.Xml.domToWorkspace(Blockly.Xml.textToDom(e.target.result), workspace);
        };
        fileReader.readAsText(event.target.files[0]);
    }

    // =============================================================
    // 8. Resizable Serial Monitor Panel
    // =============================================================
    (function() {
        const handle    = document.getElementById('console-resize-handle');
        const container = document.getElementById('console-container');
        let dragging = false, startY = 0, startH = 0;

        handle.addEventListener('mousedown', function(e) {
            dragging = true;
            startY = e.clientY;
            startH = container.getBoundingClientRect().height;
            document.body.style.cursor = 'ns-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            const delta = startY - e.clientY;          // ลากขึ้น = ใหญ่ขึ้น
            const newH  = Math.max(60, Math.min(window.innerHeight * 0.8, startH + delta));
            container.style.height = newH + 'px';
        });

        document.addEventListener('mouseup', function() {
            if (!dragging) return;
            dragging = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });

        // Double-click handle เพื่อ reset กลับ 180px
        handle.addEventListener('dblclick', function() {
            container.style.height = '180px';
        });
    })();
    </script>
